name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --omit=dev
      - run: npx cap add android
      - name: Icon, splash and version number
        run: |
          cp -r android-assets/res/* android/app/src/main/res/
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          find android/app/src/main/res -name 'splash.png' -exec cp android-assets/splash.png {} \;
          VER=$(node -p "require('./package.json').version")
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VER\"/" android/app/build.gradle
          echo "VER=$VER" >> $GITHUB_ENV
      - run: npx cap sync android
      - name: Build signed APK
        working-directory: android
        run: |
          PW=$(cat ../android-assets/keystore-password.txt)
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/android-assets/pawnledger.jks \
            -Pandroid.injected.signing.store.password=$PW \
            -Pandroid.injected.signing.key.alias=pawnledger \
            -Pandroid.injected.signing.key.password=$PW
          cp app/build/outputs/apk/release/app-release.apk ../PawnLedger-${VER}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PawnLedger-APK
          path: PawnLedger-*.apk
